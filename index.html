<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stock Live</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--g:#1f6f5c;--bg:#f3f5f4;--line:#e1e7e4;--mute:#6b7773;--ok:#c9eed6;--okt:#1c6b3e;--bad:#f8cfc9;--badt:#b3261e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:#111;font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:10;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(14px + env(safe-area-inset-top,0px)) 14px 14px}
header h1{margin:0;font-size:19px}
#upd{font-size:12.5px;display:flex;align-items:center;gap:6px}
#upd i{width:8px;height:8px;border-radius:50%;background:#5eea9c}
#upd.err i{background:#ff8a80}
#rf{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
.wrap{max-width:680px;margin:0 auto;padding:12px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 4px;text-align:center}
.box small{display:block;color:var(--mute);font-size:12.5px}
.box b{font-size:18px}
input[type=search],select{width:100%;font:inherit;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;color:#111}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
label.chk{display:flex;align-items:center;gap:10px;margin:14px 2px 6px}
label.chk input{width:22px;height:22px;accent-color:var(--g)}
.sec{color:var(--mute);font-weight:600;font-size:13.5px;margin:12px 2px 8px;display:flex;justify-content:space-between}
.sec a{color:var(--g);cursor:pointer}
.pl{display:flex;justify-content:space-between;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;cursor:pointer}
.pl.sel{border:2px solid var(--g)}
.pl .n{font-weight:600;font-size:15px;word-break:break-word}
.pl .c{color:var(--mute);font-size:13.5px;margin:2px 0 6px}
.pill{display:inline-block;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px}
.pill.ok{background:var(--ok);color:var(--okt)}
.pill.bad{background:var(--bad);color:var(--badt)}
.rt{text-align:right;flex:0 0 auto;max-width:55%}
.num{display:inline-block;font-size:19px;font-weight:700;padding:1px 7px;border-radius:7px;font-variant-numeric:tabular-nums}
.num.ok{background:var(--ok)}.num.bad{background:var(--bad)}
.rt .l{color:var(--mute);font-size:12.5px}
.rt .t{color:var(--mute);font-size:12.5px}
.ex{color:var(--mute);font-size:12px;margin-top:6px}
.fl{animation:fl 2.5s ease-out}
@keyframes fl{0%,40%{background:#fde68a}100%{background:transparent}}
.msg{text-align:center;color:var(--mute);padding:36px 10px}
.errb{background:#fff;border:1px solid #c0392b;color:#c0392b;border-radius:10px;padding:10px;margin-bottom:10px;font-size:13.5px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav button{flex:1;background:none;border:0;border-top:3px solid transparent;padding:16px 4px;font:700 15px inherit;font-family:inherit;color:var(--mute);cursor:pointer}
nav button.on{color:var(--g);border-top-color:var(--g)}
.lf{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.lf p{margin:0 0 10px;color:var(--mute)}
.lf button,.chg{background:var(--g);color:#fff;border:0;border-radius:10px;padding:11px 16px;font:inherit;margin-top:8px;cursor:pointer}
.chg{background:none;color:var(--g);padding:10px 2px;text-decoration:underline;display:block;margin:6px auto 0}
</style>
</head>
<body>
<header><h1>Stock Live</h1><div id="upd"><i></i><span id="ut">Loading…</span></div><button id="rf">Refresh</button></header>
<div class="wrap">
  <div id="eb"></div>
  <div class="sum" id="sum"></div>
  <input type="search" id="q" placeholder="Search anything in the sheet">
  <div class="r2"><select id="sort"><option value="name">Sort: Name</option><option value="lo">Sort: Lowest first</option><option value="hi">Sort: Highest first</option></select><select id="loc"></select></div>
  <label class="chk"><input type="checkbox" id="sh"> Show shortages only</label>
  <div class="sec"><span>Plants (tap to filter)</span><a id="clr" style="display:none">Clear</a></div>
  <div id="list"><div class="msg">Loading…</div></div>
</div>
<nav id="nav"></nav>
<script>
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vTmjBB6Ax-K7eqwgK2Z59kZVM4Sh9Y4kTtFYTZckoDgzjPmIDPqXfn9lumZ6BfrVutAn7noFeCCWl6Q/pub?gid=147461724&single=true&output=csv";
const TABS=[
 {name:"Box", url:CSV_URL},
 {name:"Laminate", url:""}, /* optional: paste link here, or paste it inside the app */
 {name:"FG", url:""}
];
let tab=0;
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||"";localStorage.setItem(k,v)}catch(e){return ""}};
const urlOf=i=>LS("url"+i)||TABS[i].url||"";
const REFRESH_MS=15000;
const LOW_PCT=0.15; /* a plant is "Low Carton Alert" when boxes left is 0 or under 15% of total (only used if the sheet has no status column) */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>{const n=parseFloat(String(v).replace(/[,₹$€%\s]/g,""));return isNaN(n)?null:n};
const fmt=n=>n.toLocaleString("en-IN",{maximumFractionDigits:2});
let head=[],rows=[],col={},prev=new Map(),selPlant="";

function parseCSV(t){const o=[];let r=[],f="",q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;else if(c==','){r.push(f);f=""}
  else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f="";o.push(r);r=[]}else f+=c}
 if(f!==""||r.length){r.push(f);o.push(r)}
 return o.filter(x=>x.some(v=>v.trim()!==""))}

function detect(){
 const f=(re,skip=[])=>head.findIndex((h,i)=>re.test(h)&&!skip.includes(i));
 col={};
 col.left=f(/left|remain|balance|available|in stock/i);
 col.used=f(/used|consum/i,[col.left]);
 col.total=f(/total|received|opening|supplied|qty|quantity/i,[col.left,col.used]);
 col.status=f(/status|alert/i);
 col.loc=f(/location|city|place|town|area/i);
 col.name=f(/plant|company|party|vendor|supplier|name|firm/i,[col.loc,col.status]);
 if(col.name<0)col.name=head.findIndex((h,i)=>i!==col.loc&&rows.some(r=>num(r[i])===null&&(r[i]||"").trim()));
 if(col.name<0)col.name=0;
 const used=Object.values(col);
 col.extra=head.map((_,i)=>i).filter(i=>!used.includes(i));
}
const val=(r,c,k)=>c>=0?num(r[c]):null;
function calc(r){
 let t=val(r,col.total),u=val(r,col.used),l=val(r,col.left);
 if(l===null&&t!==null&&u!==null)l=t-u;
 if(t===null&&l!==null&&u!==null)t=l+u;
 if(u===null&&t!==null&&l!==null)u=t-l;
 let low;
 if(col.status>=0){low=/low|short|alert|critical|out/i.test(r[col.status]||"")}
 else low=l!==null&&(l<=0||(t&&l/t<LOW_PCT));
 const stat=col.status>=0&&(r[col.status]||"").trim()?(r[col.status]).trim():(low?"Low Carton Alert":"Healthy Stock");
 return{t,u,l,low,stat};
}

function linkForm(){
 $("eb").innerHTML="";$("sum").innerHTML="";$("ut").textContent="Not connected";
 $("list").innerHTML='<div class="lf"><p>Paste the published CSV link for <b>'+esc(TABS[tab].name)+'</b> (Google Sheets: File, Share, Publish to web, pick the tab, choose CSV).</p><input type="search" id="lk" placeholder="https://docs.google.com/spreadsheets/d/e/..."><button id="sv">Save link</button></div>';
}
async function load(){
 if(!urlOf(tab)){head=[];rows=[];linkForm();return}
 try{
  const u=urlOf(tab);
  const res=await fetch(u+(u.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});
  if(!res.ok)throw new Error("HTTP "+res.status);
  const d=parseCSV(await res.text());
  if(d.length<2)throw new Error("Sheet is empty");
  head=d[0].map((h,i)=>h.trim()||"Column "+(i+1));rows=d.slice(1);detect();
  $("eb").innerHTML="";$("upd").classList.remove("err");
  $("ut").textContent="Updated "+new Date().toLocaleTimeString();
  try{localStorage.setItem("sl"+tab,JSON.stringify({head,rows}))}catch(e){}
 }catch(e){
  $("upd").classList.add("err");$("ut").textContent="Offline";
  $("eb").innerHTML='<div class="errb">Could not reach the sheet ('+esc(e.message)+'). Showing last saved data.</div>';
  if(!rows.length){try{const c=JSON.parse(localStorage.getItem("sl"+tab));if(c){head=c.head;rows=c.rows;detect()}}catch(_){}}
 }
 buildLoc();render();
}
function buildLoc(){
 const s=$("loc");
 if(col.loc===undefined||col.loc<0){s.style.display="none";return}
 const cur=s.value,v=[...new Set(rows.map(r=>(r[col.loc]||"").trim()).filter(Boolean))].sort();
 s.style.display="";s.innerHTML='<option value="">All locations</option>'+v.map(x=>'<option>'+esc(x)+'</option>').join("");s.value=v.includes(cur)?cur:"";
}
function render(){
 if(!head.length){$("list").innerHTML='<div class="msg">No data yet. Tap Refresh.</div>';return}
 let l=rows.map((r,i)=>({r,i,c:calc(r)}));
 // summary uses all rows (before filters)
 const T=l.reduce((a,o)=>a+(o.c.t||0),0),U=l.reduce((a,o)=>a+(o.c.u||0),0),L=l.reduce((a,o)=>a+(o.c.l||0),0);
 $("sum").innerHTML=[["Total boxes",T],["Used",U],["Remaining",L]].map(([k,v])=>'<div class="box"><small>'+k+'</small><b>'+fmt(v)+'</b></div>').join("");
 const s=$("q").value.trim().toLowerCase();
 if(selPlant)l=l.filter(o=>(o.r[col.name]||"").trim()===selPlant);
 if($("loc").style.display!=="none"&&$("loc").value)l=l.filter(o=>(o.r[col.loc]||"").trim()===$("loc").value);
 if($("sh").checked)l=l.filter(o=>o.c.low);
 if(s)l=l.filter(o=>o.r.some(v=>String(v).toLowerCase().includes(s)));
 const k=$("sort").value;
 if(k==="name")l.sort((a,b)=>String(a.r[col.name]).localeCompare(String(b.r[col.name])));
 else l.sort((a,b)=>(k==="lo"?1:-1)*((a.c.l??0)-(b.c.l??0)));
 $("clr").style.display=selPlant?"":"none";
 if(!l.length){$("list").innerHTML='<div class="msg">No plants match.</div>';return}
 const next=new Map();let h="";
 l.forEach(o=>{
  const key=o.i+"|"+o.c.l,chg=prev.size&&prev.get(o.i)!==undefined&&prev.get(o.i)!==o.c.l;next.set(o.i,o.c.l);
  const nm=(o.r[col.name]||"—").trim(),loc=col.loc>=0?(o.r[col.loc]||"").trim():"";
  const ex=col.extra.map(i=>{const v=(o.r[i]||"").trim();return v?esc(head[i])+": "+esc(v):""}).filter(Boolean).join(" · ");
  const cls=o.c.low?"bad":"ok";
  h+='<div class="pl'+(selPlant===nm?' sel':'')+'" data-n="'+esc(nm)+'"><div><div class="n">'+esc(nm)+'</div>'+(loc?'<div class="c">'+esc(loc)+'</div>':'')+'<span class="pill '+cls+'">'+esc(o.c.stat)+'</span></div>'
   +'<div class="rt"><span class="num '+(o.c.l===0?'':cls)+(chg?' fl':'')+'">'+(o.c.l===null?"—":fmt(o.c.l))+'</span><div class="l">boxes left</div><div class="t">Total '+(o.c.t===null?"—":fmt(o.c.t))+' · Used '+(o.c.u===null?"—":fmt(o.c.u))+'</div>'+(ex?'<div class="ex">'+ex+'</div>':'')+'</div></div>';
 });
 $("list").innerHTML=h+'<button class="chg" id="chg">Change link for '+esc(TABS[tab].name)+'</button>';prev=next;
}
function buildNav(){$("nav").innerHTML=TABS.map((t,i)=>'<button class="'+(i===tab?'on':'')+'" data-i="'+i+'">'+esc(t.name)+'</button>').join("")}
$("nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;tab=+b.dataset.i;head=[];rows=[];prev=new Map();selPlant="";buildNav();$("list").innerHTML='<div class="msg">Loading…</div>';load()};
document.addEventListener("click",e=>{
 if(e.target.id==="sv"){const v=$("lk").value.trim();if(!/^https:\/\/docs\.google\.com\//.test(v)){alert("Please paste a link that starts with https://docs.google.com");return}LS("url"+tab,v);load()}
 if(e.target.id==="chg"){LS("url"+tab,"");head=[];rows=[];linkForm()}
});
$("list").onclick=e=>{const c=e.target.closest(".pl");if(!c)return;selPlant=selPlant===c.dataset.n?"":c.dataset.n;render()};
$("clr").onclick=()=>{selPlant="";render()};
["q","sort","loc","sh"].forEach(id=>$(id).oninput=render);
$("rf").onclick=load;
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
buildNav();load();setInterval(()=>{if(!document.hidden)load()},REFRESH_MS);
</script>
</body>
</html>
