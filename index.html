<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5e4b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Stock Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4f7f5; --card:#ffffff; --ink:#14201c; --muted:#5d6e67; --line:#dde5e1;
  --pine:#1f5e4b; --ok:#2e7d4f; --warn:#c07f08; --bad:#c8372d;
  --bad-soft:#fbe9e7; --warn-soft:#fdf2dc; --ok-soft:#e5f3ea; --none-soft:#eceff0;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#0f1613; --card:#17211d; --ink:#e8f0ec; --muted:#93a59d; --line:#27342f;
    --pine:#5cc0a0; --ok:#5fc287; --warn:#e3a93a; --bad:#ef6b60;
    --bad-soft:#35201e; --warn-soft:#33290f; --ok-soft:#18291f; --none-soft:#222c28;}
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--paper);color:var(--ink);
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);min-height:100vh;font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 40px}
header{position:sticky;top:0;z-index:5;background:var(--paper);padding:14px 0 10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:2px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.dot.stale{background:var(--bad)} .dot.busy{background:var(--warn)}
.refresh{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.tabs{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:12px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:0;background:transparent;color:var(--muted);font:600 14px 'Figtree',sans-serif;padding:10px 14px;border-radius:9px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.filters{margin-top:12px;display:grid;gap:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 13px 'Figtree',sans-serif;padding:7px 12px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:#fff}
@media (prefers-color-scheme:dark){.chip[aria-pressed="true"]{color:#0f1613}}
input[type=search]{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 12px;font:400 15px 'Figtree',sans-serif}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.summary.two{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.stat b small{font-size:12px;font-weight:500;color:var(--muted)}
.stat span{font-size:12px;color:var(--muted)}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)}
.plant{margin-top:20px}
.plant-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 2px 8px}
.plant-head h2{font-size:15px;font-weight:700}
.plant-head span{font-size:12px;color:var(--muted);text-align:right}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{padding:12px 14px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:start}
.row:first-child{border-top:0}
.sku{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.qty{font-size:20px;font-weight:700;text-align:right;letter-spacing:-.01em;white-space:nowrap}
.qty small{font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}
.meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.note{font-size:12px;color:var(--muted);text-align:right}
.note.bad{color:var(--bad);font-weight:600} .note.ok{color:var(--ok)}
.cover{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:6px}
.bar{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--pine)}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--none-soft);color:var(--muted)}
.s-ok .bar i{background:var(--ok)} .s-ok .pill{background:var(--ok-soft);color:var(--ok)}
.s-warn .bar i{background:var(--warn)} .s-warn .pill{background:var(--warn-soft);color:var(--warn)}
.s-bad .bar i{background:var(--bad)} .s-bad .pill{background:var(--bad-soft);color:var(--bad)}
.notice{margin:14px 0 0;padding:10px 12px;border-radius:10px;font-size:13px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--line)}
.empty{text-align:center;color:var(--muted);padding:40px 12px;font-size:14px}
.skeleton{height:64px;border-radius:12px;background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200% 100%;animation:sk 1.2s infinite;margin-top:10px}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}}
details.day{border-top:1px solid var(--line)} details.day:first-child{border-top:0}
details.day summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
details.day summary::-webkit-details-marker{display:none}
details.day .inner{padding:0 14px 12px}
.sub{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:6px 0;border-top:1px dashed var(--line)}
.sub span:last-child{font-weight:600;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div>
        <h1>Stock Live</h1>
        <div class="sync"><span class="dot busy" id="dot"></span><span id="syncText">Loading…</span></div>
      </div>
      <button class="refresh" id="refresh" aria-label="Refresh now">⟳</button>
    </div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="filters">
      <div class="chips" id="plantChips" aria-label="Filter by plant"></div>
      <div class="chips" id="catChips" aria-label="Filter by category"></div>
      <input type="search" id="q" placeholder="Search product or SKU code" autocomplete="off">
    </div>
  </header>
  <div id="notice"></div>
  <main id="content"></main>
</div>

<script>
/* ================= SETTINGS: edit this block only ================= */
const CONFIG = {
  refreshSeconds: 60,

  // In Google Sheets: File > Share > Publish to web > "Entire document" > Publish.
  // Your link looks like  https://docs.google.com/spreadsheets/d/e/2PACX-xxxxxxxx/pubhtml
  // Paste only the part after /d/e/ and before /pub, e.g.  '2PACX-xxxxxxxx'

  // Optional: paste a full CSV link for any single tab here to override the one above.
  urls: {
    // summary: '', dashboard: '', planvs: '', carton: '', biscuit: '', rusk: '', production: ''
  }
};
/* ================================================================== */

/* Tab IDs (gid) of your sheet "Oct_Tracker_Product_Wise" */
const GIDS = {
  summary: 147461724,     // Production & Stock Summary
  dashboard: 944898191,   // Till Date Stock Dashboard
  planvs: 696502685,      // Plan vs Production
  carton: 373350048,      // Carton Summary
  biscuit: 1908503702,    // Biscuit (laminate)
  rusk: 345177144,        // Rusk (laminate)
  production: 37015214    // Production (daily)
};
const TAB_NAMES = {
  summary: 'Production & Stock Summary', dashboard: 'Till Date Stock Dashboard', planvs: 'Plan vs Production',
  carton: 'Carton Summary', biscuit: 'Biscuit', rusk: 'Rusk', production: 'Production'
};

/*==PURE_START==*/
/* Short names for your plants. Add a line if a new plant joins. */
const PLANTS = [
  ['VEETADAY', 'Veetaday', 'Lucknow'],
  ['SWG', 'SWG', 'Rudrapur'],
  ['STRAIGHT LINE', 'Straight Line', 'Asansol'],
  ['RATTAN', 'Rattan Oil Mills', 'Kathua'],
  ['BHAGWATI', 'Bhagwati', 'Kolkata'],
  ['DEVARPAN', 'Devarpan', 'Kashipur'],
  ['SAHARNPUR', 'Shubham', 'Saharanpur'],
  ['SAHARANPUR', 'Shubham', 'Saharanpur'],
  ['SHUBHAM', 'Shubham', 'Saharanpur'],
  ['MEERA', 'Meera Baker', 'Kanpur'],
  ['SHRI SHYAM', 'Shri Shyam', 'Punjab']
];
const titleCase = s => String(s).toLowerCase().replace(/\b[a-z]/g, c => c.toUpperCase()).trim();
function plantInfo(text){
  const u = String(text || '').toUpperCase();
  for (const [k, n, l] of PLANTS) if (u.includes(k)) return { name: n, place: l };
  return { name: titleCase(text || 'Unknown'), place: '' };
}
const catOf = (...t) => /rusk/i.test(t.join(' ')) ? 'Rusk' : 'Biscuit';

/* ---- CSV + number helpers ---- */
function parseCSV(text){
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"' && text[i+1] === '"'){ cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ','){ row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r'){
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(cur); rows.push(row); row = []; cur = '';
    } else cur += c;
  }
  if (cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ''));
}
const norm = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim().toLowerCase();
function toNum(v){
  if (v == null) return null;
  let s = String(v).trim();
  if (s === '') return null;
  if (s === '-') return 0;
  const neg = /^\(.*\)$/.test(s);
  s = s.replace(/[(),₹%\s]/g, '');
  if (s === '' || s === '-') return 0;
  const n = parseFloat(s);
  if (isNaN(n)) return null;
  return neg ? -n : n;
}
const nz = v => { const n = toNum(v); return n === null ? 0 : n; };

/* Find the header row, then look up columns by name (exact first, then "contains"). */
function findTable(rows, mustHave, tabName){
  const idx = rows.findIndex(r => { const h = r.map(norm); return mustHave.every(m => h.some(x => x.includes(m))); });
  if (idx < 0) throw new Error('The "' + tabName + '" tab does not have the columns the app expects (' + mustHave.join(', ') + ').');
  return { head: rows[idx].map(norm), body: rows.slice(idx + 1) };
}
function col(head, ...names){
  for (const n of names){ const i = head.indexOf(n); if (i > -1) return i; }
  for (const n of names){ const i = head.findIndex(h => h.includes(n)); if (i > -1) return i; }
  return -1;
}
const cell = (r, i) => (i > -1 && r[i] != null) ? String(r[i]).trim() : '';
const isTotalRow = (...cells) => cells.some(c => /^total\b|grand total/i.test(String(c || '').trim()));
const isSection = c => /^\d+\.\s/.test(String(c || '').trim());

/* ---- one adapter per tab ---- */
function adaptSummary(rows){
  const { head, body } = findTable(rows, ['plant / cmu name', 'sku code'], TAB_NAMES.summary);
  const c = {
    plant: col(head, 'plant / cmu name'), product: col(head, 'product name'), sku: col(head, 'sku code'),
    planT: col(head, 'plan (tons)'), planC: col(head, 'plan (cases)'),
    madeT: col(head, 'till date prod (tons)'), madeC: col(head, 'till date prod (cases)'),
    leftT: col(head, 'remaining prod (tons)'), boxes: col(head, 'balance carton'), lam: col(head, 'balance laminate')
  };
  const out = [];
  for (const r of body){
    const sku = cell(r, c.sku), pl = cell(r, c.plant);
    if (!sku || sku === '-' || isTotalRow(pl)) continue;
    const p = plantInfo(pl), product = cell(r, c.product);
    out.push({ plant: p.name, place: p.place, sku, product, category: catOf(product),
      planT: nz(r[c.planT]), planC: nz(r[c.planC]), madeT: nz(r[c.madeT]), madeC: nz(r[c.madeC]),
      leftT: nz(r[c.leftT]), boxes: nz(r[c.boxes]), lamKg: nz(r[c.lam]) });
  }
  return out;
}
function adaptDashboard(rows){
  const { head, body } = findTable(rows, ['remaining cartons', 'remaining laminate'], TAB_NAMES.dashboard);
  const c = { loc: col(head, 'location'), cmu: col(head, 'cmu / plant name'), cat: col(head, 'category'),
    boxes: col(head, 'remaining cartons'), boxesAvail: col(head, 'available cartons'), boxStatus: col(head, 'carton status'),
    lam: col(head, 'remaining laminate'), lamStatus: col(head, 'laminate status'), health: col(head, 'overall stock health') };
  const out = [];
  for (const r of body){
    const loc = cell(r, c.loc), cmu = cell(r, c.cmu);
    if (isTotalRow(loc, cmu) || isSection(loc) || isSection(cmu)) break;
    if (!loc && !cmu) continue;
    const p = plantInfo(loc + ' ' + cmu);
    out.push({ plant: p.name, place: p.place, category: catOf(cell(r, c.cat)),
      boxes: nz(r[c.boxes]), lamKg: nz(r[c.lam]), boxStatus: cell(r, c.boxStatus), lamStatus: cell(r, c.lamStatus),
      health: cell(r, c.health) });
  }
  return out;
}
function adaptPlanVs(rows){
  const { head, body } = findTable(rows, ['month plan (tons)', 'actual prod (tons)'], TAB_NAMES.planvs);
  const c = { loc: col(head, 'location'), cmu: col(head, 'cmu name'), cat: col(head, 'category'),
    planT: col(head, 'month plan (tons)'), madeT: col(head, 'actual prod (tons)'), status: col(head, 'production status'),
    skus: col(head, 'active skus') };
  const out = [];
  for (const r of body){
    const loc = cell(r, c.loc), cmu = cell(r, c.cmu);
    if (isTotalRow(loc, cmu) || isSection(loc) || isSection(cmu)) break;
    if (!loc && !cmu) continue;
    const p = plantInfo(loc + ' ' + cmu);
    out.push({ plant: p.name, category: catOf(cell(r, c.cat)), planT: nz(r[c.planT]), madeT: nz(r[c.madeT]),
      status: cell(r, c.status), skus: nz(r[c.skus]) });
  }
  return out;
}
function adaptCarton(rows){
  const { head, body } = findTable(rows, ['sku code', 'cmu name', 'shortage'], TAB_NAMES.carton);
  const c = { cmu: col(head, 'cmu name'), loc: col(head, 'location'), cat: col(head, 'product category'),
    sku: col(head, 'sku code'), product: col(head, 'product name'), caseSize: col(head, 'case size'),
    open: col(head, 'opening stock'), recv: col(head, 'cartoon received', 'carton received', 'received'),
    total: col(head, 'total cartoons', 'total cartons'), plan: col(head, 'plan in case', 'production plan'),
    short: col(head, 'shortage'), po: col(head, 'po rem', 'po remarks') };
  const out = [];
  for (const r of body){
    const sku = cell(r, c.sku), cmu = cell(r, c.cmu);
    if (!sku || isTotalRow(cmu)) continue;
    const p = plantInfo(cmu + ' ' + cell(r, c.loc)), product = cell(r, c.product);
    out.push({ plant: p.name, place: p.place, sku, product, category: catOf(cell(r, c.cat), product),
      open: nz(r[c.open]), recv: nz(r[c.recv]), total: nz(r[c.total]), planC: nz(r[c.plan]),
      shortage: nz(r[c.short]), po: cell(r, c.po) });
  }
  return out;
}
function adaptLaminate(rows, tabName, fallbackCat){
  const { head, body } = findTable(rows, ['merge sku', 'opening stock (kg)'], tabName);
  const c = { cmu: col(head, 'cmu name'), loc: col(head, 'location'), cat: col(head, 'product category'),
    sku: col(head, 'sku code'), product: col(head, 'product name'),
    cur: col(head, 'current stock (kg)'), req: col(head, 'required laminate (kg)'), net: col(head, 'net balance'),
    po: col(head, 'po status'), planT: col(head, 'month plan (tons)'), madeT: col(head, 'production mtd (tons)'),
    capC: col(head, 'balance capacity (cases)'), transit: col(head, 'transit stock') };
  const out = [];
  for (const r of body){
    const sku = cell(r, c.sku), cmu = cell(r, c.cmu);
    if (!sku || isTotalRow(cmu)) continue;
    const p = plantInfo(cmu + ' ' + cell(r, c.loc)), product = cell(r, c.product);
    out.push({ plant: p.name, place: p.place, sku, product, category: fallbackCat || catOf(cell(r, c.cat), product),
      curKg: nz(r[c.cur]), reqKg: nz(r[c.req]), netKg: nz(r[c.net]), po: cell(r, c.po),
      planT: nz(r[c.planT]), madeT: nz(r[c.madeT]), capC: nz(r[c.capC]), transitKg: nz(r[c.transit]) });
  }
  return out;
}
const MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function adaptProduction(rows, year){
  const { head, body } = findTable(rows, ['sku code', 'product name', 'cmu name'], TAB_NAMES.production);
  const days = [];
  head.forEach((h, i) => {
    const m = /^(\d{1,2})-([a-z]{3})$/.exec(h);
    if (m && MONTHS.includes(m[2])) days.push({ col: i, label: h.replace(/[a-z]{3}$/, s => s[0].toUpperCase() + s.slice(1)), date: new Date(year, MONTHS.indexOf(m[2]), +m[1]) });
  });
  const c = { cmu: col(head, 'cmu name'), loc: col(head, 'location'), cat: col(head, 'product category'),
    sku: col(head, 'sku code'), product: col(head, 'product name'), gm: col(head, 'gm'), cs: col(head, 'case size') };
  const out = [];
  for (const r of body){
    const sku = cell(r, c.sku), cmu = cell(r, c.cmu);
    if (!sku || isTotalRow(cmu)) continue;
    const p = plantInfo(cmu + ' ' + cell(r, c.loc)), product = cell(r, c.product);
    const tonsPerCase = nz(r[c.gm]) * nz(r[c.cs]) / 1e6;
    out.push({ plant: p.name, place: p.place, sku, product, category: catOf(cell(r, c.cat), product),
      tonsPerCase, vals: days.map(d => nz(r[d.col])) });
  }
  return { days, rows: out };
}
/*==PURE_END==*/

/* ---------- sample data (shown until pubId is set) ---------- */
const DEMO = {

,VEETADAY INDUSTRIES PRIVATE LIMITED,Samuh Butter Cookies Biscuit 32 g,ROZ23743,10.50,"2,278",0.00,0,10.50,"2,278",0.0%,"1,293",575.00

/* ---------- state + loading ---------- */
const $ = id => document.getElementById(id);
const state = { view: 'overview', plant: 'All', cat: 'All', q: '', planned: true, ds: null, updated: null, errors: [], demo: false };

function urlFor(key){
  if (CONFIG.urls && CONFIG.urls[key]) return CONFIG.urls[key];
  if (CONFIG.pubId) return 'https://docs.google.com/spreadsheets/d/e/' + CONFIG.pubId + '/pub?gid=' + GIDS[key] + '&single=true&output=csv';
  return '';
}
async function getRows(key){
  const u = urlFor(key);
  if (!u) return parseCSV(DEMO[key]);
  const res = await fetch(u + (u.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error('Could not open the "' + TAB_NAMES[key] + '" tab (error ' + res.status + '). Check that the sheet is published.');
  return parseCSV(await res.text());
}
async function loadAll(){
  $('dot').className = 'dot busy';
  const year = new Date().getFullYear();
  const keys = Object.keys(GIDS);
  state.demo = keys.every(k => !urlFor(k));
  const raw = await Promise.allSettled(keys.map(getRows));
  const R = {}, errors = [];
  raw.forEach((r, i) => { if (r.status === 'fulfilled') R[keys[i]] = r.value; else errors.push(r.reason.message); });
  const ds = state.ds || {};
  const attempt = (name, fn) => { try { ds[name] = fn(); } catch (e) { errors.push(e.message); } };
  if (R.summary) attempt('plan', () => adaptSummary(R.summary));
  if (R.carton) attempt('box', () => adaptCarton(R.carton));
  if (R.biscuit || R.rusk) attempt('lam', () => [
    ...(R.biscuit ? adaptLaminate(R.biscuit, TAB_NAMES.biscuit, 'Biscuit') : []),
    ...(R.rusk ? adaptLaminate(R.rusk, TAB_NAMES.rusk, 'Rusk') : [])]);
  if (R.production) attempt('prod', () => adaptProduction(R.production, year));
  let dash = null, pv = null;
  if (R.dashboard) attempt('_dash', () => (dash = adaptDashboard(R.dashboard)));
  if (R.planvs) attempt('_pv', () => (pv = adaptPlanVs(R.planvs)));
  if (dash){
    ds.overview = dash.map(d => {
      const p = (pv || []).find(x => x.plant === d.plant && x.category === d.category);
      return { ...d, planT: p ? p.planT : 0, madeT: p ? p.madeT : 0, prodStatus: p ? p.status : '' };
    });
  }
  state.ds = ds;
  state.errors = errors;
  if (Object.keys(R).length) state.updated = new Date();
  render();
}

/* ---------- rendering helpers ---------- */
const fmt = (n, d = 0) => (n == null || isNaN(n)) ? '–' : Number(n).toLocaleString('en-IN', { maximumFractionDigits: d });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pct = (a, b) => b > 0 ? Math.max(0, Math.min(100, a / b * 100)) : 0;

function rowHTML(o){
  return '<div class="row' + (o.cls ? ' ' + o.cls : '') + '">' +
    '<div><div class="sku">' + esc(o.title) + '</div>' + (o.sub ? '<div class="meta">' + esc(o.sub) + '</div>' : '') + '</div>' +
    '<div><div class="qty">' + o.big + (o.unit ? '<small>' + esc(o.unit) + '</small>' : '') + '</div>' +
    (o.note ? '<div class="note ' + (o.noteCls || '') + '">' + esc(o.note) + '</div>' : '') + '</div>' +
    (o.bar != null || o.pill ? '<div class="cover">' + (o.bar != null ? '<div class="bar"><i style="width:' + Math.max(o.bar > 0 ? 3 : 0, o.bar) + '%"></i></div>' : '<div class="bar"></div>') +
      (o.pill ? '<span class="pill">' + esc(o.pill) + '</span>' : '') + '</div>' : '') +
    '</div>';
}
function groupByPlant(rows){
  const g = {};
  rows.forEach(r => (g[r.plant] = g[r.plant] || []).push(r));
  return Object.keys(g).sort().map(k => ({ name: k, place: g[k][0].place || '', rows: g[k] }));
}
function section(name, place, right, bodyHTML){
  return '<section class="plant"><div class="plant-head"><h2>' + esc(name) + (place ? ' · ' + esc(place) : '') + '</h2><span>' + right + '</span></div><div class="list">' + bodyHTML + '</div></section>';
}
const stat = (big, label, cls, small) => '<div class="stat ' + (cls || '') + '"><b>' + big + (small ? ' <small>' + small + '</small>' : '') + '</b><span>' + label + '</span></div>';

/* ---------- the five views ---------- */
function viewOverview(rows){
  const sev = h => /critical/i.test(h) ? 0 : /attention/i.test(h) ? 1 : 2;
  const boxes = rows.reduce((a, r) => a + r.boxes, 0), lam = rows.reduce((a, r) => a + r.lamKg, 0);
  const plan = rows.reduce((a, r) => a + r.planT, 0), made = rows.reduce((a, r) => a + r.madeT, 0);
  const attn = rows.filter(r => sev(r.health) < 2).length;
  let html = '<div class="summary two">' + stat(fmt(boxes), 'Boxes in stock') + stat(fmt(lam), 'Laminate in stock', '', 'kg') +
    stat(fmt(made, 1), 'Made so far · plan ' + fmt(plan, 1) + ' t', '', 't') + stat(attn, 'Plant lines needing action', attn ? 'bad' : '') + '</div>';
  if (!rows.length) return html + '<div class="empty">No plants match these filters.</div>';
  const list = rows.slice().sort((a, b) => sev(a.health) - sev(b.health) || a.plant.localeCompare(b.plant));
  html += '<section class="plant"><div class="plant-head"><h2>Plant stock health</h2><span>Worst first</span></div><div class="list">';
  list.forEach(r => {
    const s = sev(r.health), label = s === 0 ? 'Critical' : s === 1 ? 'Attention' : 'Healthy';
    const issues = [];
    if (r.boxes < 0) issues.push('Box stock is negative: check entries');
    else if (r.boxes === 0) issues.push('No boxes');
    if (r.lamKg <= 0) issues.push('No laminate');
    html += rowHTML({
      title: r.plant + ' · ' + r.category, sub: r.place + ' · ' + fmt(r.boxes) + ' boxes · ' + fmt(r.lamKg) + ' kg laminate',
      big: fmt(r.madeT, 1), unit: 't made', note: r.planT ? 'of ' + fmt(r.planT, 1) + ' t plan' : 'no plan',
      bar: r.planT ? pct(r.madeT, r.planT) : null, pill: label + (issues.length ? ' · ' + issues[0] : ''),
      cls: s === 0 ? 's-bad' : s === 1 ? 's-warn' : 's-ok'
    });
  });
  return html + '</div></section>';
}
function viewPlan(rows){
  const plan = rows.reduce((a, r) => a + r.planT, 0), made = rows.reduce((a, r) => a + r.madeT, 0);
  let html = '<div class="summary">' + stat(fmt(plan, 1), 'Plan', '', 't') + stat(fmt(made, 1), 'Made', '', 't') + stat(fmt(Math.max(plan - made, 0), 1), 'Still to make', '', 't') + '</div>';
  if (!rows.length) return html + '<div class="empty">No SKUs match these filters.</div>';
  groupByPlant(rows).forEach(g => {
    const gp = g.rows.reduce((a, r) => a + r.planT, 0), gm = g.rows.reduce((a, r) => a + r.madeT, 0);
    const body = g.rows.sort((a, b) => b.leftT - a.leftT || a.product.localeCompare(b.product)).map(r => rowHTML({
      title: r.product, sub: r.sku + ' · ' + fmt(r.boxes) + ' boxes · ' + fmt(r.lamKg) + ' kg laminate',
      big: fmt(r.madeT, 2), unit: 't made', note: r.planT ? 'of ' + fmt(r.planT, 2) + ' t · ' + fmt(r.leftT, 2) + ' t left' : 'no plan',
      bar: r.planT ? pct(r.madeT, r.planT) : null, pill: r.planT ? Math.round(pct(r.madeT, r.planT)) + '% of plan made' : ''
    })).join('');
    html += section(g.name, g.place, fmt(gm, 1) + ' of ' + fmt(gp, 1) + ' t made', body);
  });
  return html;
}
function viewBox(rows){
  const total = rows.reduce((a, r) => a + r.total, 0);
  const short = rows.filter(r => r.planC > 0 && r.shortage < 0);
  const need = short.reduce((a, r) => a - r.shortage, 0);
  let html = '<div class="summary">' + stat(fmt(total), 'Boxes in stock') + stat(short.length, 'SKUs short for plan', short.length ? 'bad' : '') + stat(fmt(need), 'Boxes to buy', need ? 'warn' : '') + '</div>';
  if (!rows.length) return html + '<div class="empty">No SKUs match these filters.</div>';
  groupByPlant(rows).forEach(g => {
    const body = g.rows.sort((a, b) => a.shortage - b.shortage || a.product.localeCompare(b.product)).map(r => {
      const isShort = r.planC > 0 && r.shortage < 0;
      return rowHTML({
        title: r.product, sub: r.sku,
        big: fmt(r.total), unit: 'boxes',
        note: r.planC ? (isShort ? 'Short ' + fmt(-r.shortage) + ' for plan' : fmt(r.shortage) + ' spare after plan') : 'no plan',
        noteCls: isShort ? 'bad' : r.planC ? 'ok' : '',
        bar: r.planC ? pct(r.total, r.planC) : null, pill: r.po || '',
        cls: isShort ? 's-bad' : r.planC ? 's-ok' : ''
      });
    }).join('');
    html += section(g.name, g.place, fmt(g.rows.reduce((a, r) => a + r.total, 0)) + ' boxes', body);
  });
  return html;
}
function viewLam(rows){
  const total = rows.reduce((a, r) => a + r.curKg, 0);
  const needPO = rows.filter(r => r.reqKg > 0 && r.netKg < 0);
  const gap = needPO.reduce((a, r) => a - r.netKg, 0);
  let html = '<div class="summary">' + stat(fmt(total), 'Laminate in stock', '', 'kg') + stat(needPO.length, 'SKUs needing PO', needPO.length ? 'bad' : '') + stat(fmt(gap), 'Kg to order', gap ? 'warn' : '') + '</div>';
  if (!rows.length) return html + '<div class="empty">No SKUs match these filters.</div>';
  groupByPlant(rows).forEach(g => {
    const body = g.rows.sort((a, b) => (a.reqKg > 0 ? a.netKg : 1e12) - (b.reqKg > 0 ? b.netKg : 1e12) || a.product.localeCompare(b.product)).map(r => {
      const isShort = r.reqKg > 0 && r.netKg < 0;
      return rowHTML({
        title: r.product, sub: r.sku + (r.transitKg ? ' · ' + fmt(r.transitKg, 1) + ' kg in transit' : ''),
        big: fmt(r.curKg, 1), unit: 'kg',
        note: r.reqKg ? (isShort ? 'Short ' + fmt(-r.netKg, 1) + ' kg for plan' : fmt(r.netKg, 1) + ' kg spare after plan') : 'no plan',
        noteCls: isShort ? 'bad' : r.reqKg ? 'ok' : '',
        bar: r.reqKg ? pct(r.curKg, r.reqKg) : null, pill: r.po || '',
        cls: isShort ? 's-bad' : r.reqKg ? 's-ok' : ''
      });
    }).join('');
    html += section(g.name, g.place, fmt(g.rows.reduce((a, r) => a + r.curKg, 0)) + ' kg', body);
  });
  return html;
}
function viewDaily(rows){
  const days = state.ds.prod.days;
  const today = new Date(); today.setHours(23, 59, 59, 999);
  const list = days.map((d, i) => {
    const per = rows.map(r => ({ r, cases: r.vals[i] })).filter(x => x.cases > 0);
    return { d, cases: per.reduce((a, x) => a + x.cases, 0), tons: per.reduce((a, x) => a + x.cases * x.r.tonsPerCase, 0), per };
  }).filter(x => x.d.date <= today).reverse();
  const totC = list.reduce((a, x) => a + x.cases, 0), totT = list.reduce((a, x) => a + x.tons, 0);
  const max = Math.max(1, ...list.map(x => x.cases));
  let html = '<div class="summary">' + stat(fmt(totT, 1), 'Made this month', '', 't') + stat(fmt(totC), 'Cases') + stat(list.filter(x => x.cases > 0).length, 'Days with entry') + '</div>';
  if (!list.length) return html + '<div class="empty">No days found in the Production tab.</div>';
  html += '<section class="plant"><div class="plant-head"><h2>Day by day</h2><span>Tap a day to see SKUs</span></div><div class="list">';
  list.forEach(x => {
    const items = x.per.sort((a, b) => b.cases - a.cases).map(p =>
      '<div class="sub"><span>' + esc(p.r.product) + ' · ' + esc(p.r.plant) + '</span><span>' + fmt(p.cases) + ' cases</span></div>').join('');
    html += '<details class="day"><summary><div><div class="sku">' + esc(x.d.label) + '</div>' +
      '<div class="meta">' + (x.cases ? x.per.length + ' SKUs' : 'No entry') + '</div></div>' +
      '<div><div class="qty">' + fmt(x.cases) + '<small>cases</small></div><div class="note">' + (x.cases ? fmt(x.tons, 1) + ' t' : '') + '</div></div>' +
      '<div class="cover" style="grid-column:1/-1"><div class="bar"><i style="width:' + pct(x.cases, max) + '%"></i></div></div></summary>' +
      (items ? '<div class="inner">' + items + '</div>' : '') + '</details>';
  });
  return html + '</div></section>';
}

const VIEWS = {
  overview: { label: 'Overview', rows: ds => ds.overview, fn: viewOverview, planned: null },
  plan:     { label: 'Plan',     rows: ds => ds.plan,     fn: viewPlan,     planned: r => r.planT > 0 },
  box:      { label: 'Box',      rows: ds => ds.box,      fn: viewBox,      planned: r => r.planC > 0 },
  laminate: { label: 'Laminate', rows: ds => ds.lam,      fn: viewLam,      planned: r => r.planT > 0 },
  daily:    { label: 'Daily',    rows: ds => ds.prod && ds.prod.rows, fn: viewDaily, planned: null }
};

function chips(el, values, current, onPick){
  el.innerHTML = '';
  if (values.length <= 2){ el.style.display = 'none'; return; }
  el.style.display = 'flex';
  values.forEach(v => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = v; b.setAttribute('aria-pressed', v === current);
    b.onclick = () => onPick(v); el.appendChild(b);
  });
}

function render(){
  const tabs = $('tabs');
  if (!tabs.children.length){
    Object.keys(VIEWS).forEach(k => {
      const b = document.createElement('button');
      b.className = 'tab'; b.setAttribute('role', 'tab'); b.dataset.view = k; b.textContent = VIEWS[k].label;
      b.onclick = () => { state.view = k; render(); window.scrollTo(0, 0); };
      tabs.appendChild(b);
    });
  }
  [...tabs.children].forEach(t => t.setAttribute('aria-selected', t.dataset.view === state.view));

  const dot = $('dot'), st = $('syncText');
  if (state.updated){
    const t = state.updated.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    st.textContent = (state.demo ? 'Sample data · ' : 'Updated ') + t;
    dot.className = 'dot' + (state.errors.length ? ' stale' : '');
  } else { st.textContent = 'Could not load'; dot.className = 'dot stale'; }

  let note = '';
  if (state.demo) note = 'Showing sample data. Add your pubId in CONFIG to see live numbers.';
  else if (state.errors.length) note = state.errors.join(' ');
  $('notice').innerHTML = note ? '<div class="notice">' + esc(note) + '</div>' : '';

  const V = VIEWS[state.view];
  const base = state.ds && V.rows(state.ds);
  if (!base){
    $('content').innerHTML = state.updated ? '<div class="empty">This view has no data yet.</div>' : '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
    $('plantChips').style.display = $('catChips').style.display = 'none';
    return;
  }
  const srt = a => ['All', ...[...new Set(a.filter(Boolean))].sort()];
  const plants = srt(base.map(r => r.plant)), cats = srt(base.map(r => r.category));
  if (!plants.includes(state.plant)) state.plant = 'All';
  if (!cats.includes(state.cat)) state.cat = 'All';
  chips($('plantChips'), plants, state.plant, v => { state.plant = v; render(); });
  chips($('catChips'), cats, state.cat, v => { state.cat = v; render(); });

  if (V.planned){
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = 'Planned SKUs only'; b.setAttribute('aria-pressed', state.planned);
    b.onclick = () => { state.planned = !state.planned; render(); };
    $('catChips').style.display = 'flex'; $('catChips').appendChild(b);
  }

  const q = state.q.trim().toLowerCase();
  const rows = base.filter(r =>
    (state.plant === 'All' || r.plant === state.plant) &&
    (state.cat === 'All' || r.category === state.cat) &&
    (!V.planned || !state.planned || V.planned(r)) &&
    (!q || (r.product || '').toLowerCase().includes(q) || (r.sku || '').toLowerCase().includes(q) || (r.plant || '').toLowerCase().includes(q)));
  $('content').innerHTML = V.fn(rows);
}

/* ---------- wiring ---------- */
$('q').addEventListener('input', e => { state.q = e.target.value; render(); });
$('refresh').onclick = loadAll;
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadAll(); });
setInterval(() => { if (!document.hidden) loadAll(); }, CONFIG.refreshSeconds * 1000);
try {
  const m = { name: 'Stock Live', short_name: 'Stock', start_url: '.', display: 'standalone', background_color: '#f4f7f5', theme_color: '#1f5e4b' };
  const l = document.createElement('link'); l.rel = 'manifest';
  l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/json' }));
  document.head.appendChild(l);
} catch (e) {}
render();
loadAll();
</script>
</body>
</html>
